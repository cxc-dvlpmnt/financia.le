services:
  - type: web
    name: financia-le-private
    runtime: python
    plan: free
    buildCommand: "python3 -m py_compile app.py"
    startCommand: "python3 app.py"
    healthCheckPath: /health
    envVars:
      - key: FINANCIA_DB
        value: /tmp/financia.db
      - key: FINANCIA_USER
        sync: false
      - key: FINANCIA_PASSWORD
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
