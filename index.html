<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d12"><title>financia.le — The daily finance guessing game</title><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf2;background:#080d12;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse 85% 50% at 50% -30%,#183c36 0%,transparent 80%),#080d12}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.35}.wrap{max-width:940px;margin:auto;padding:0 28px}.top{height:79px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e2a32}.logo{font-size:25px;letter-spacing:-1.5px;font-weight:800}.logo b{color:#6ee7b7}.pill{font-size:10px;font-weight:800;letter-spacing:1.3px;border:1px solid #315548;color:#80e3bb;padding:7px 11px;border-radius:20px}.topright{display:flex;align-items:center;gap:15px;color:#8898a6;font-size:12px}.topright button{background:transparent;border:0;color:#98a9b4}.main{max-width:700px;margin:80px auto 0}.eyebrow{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;color:#64d9ab;text-transform:uppercase}.hero{font-size:clamp(43px,7vw,68px);line-height:1.06;letter-spacing:-3px;margin:20px 0 22px;font-weight:780}.muted{color:#8495a2;line-height:1.7}.lead{font-size:17px;max-width:490px}.actions{display:flex;gap:12px;margin-top:33px;flex-wrap:wrap}.btn{background:#78e6b4;color:#06150f;border:1px solid #78e6b4;border-radius:9px;padding:14px 23px;font-weight:750;transition:transform .15s,background .15s}.btn:hover:not(:disabled){transform:translateY(-1px);background:#a4f3cf}.btn.secondary{background:#121d23;border-color:#2c3c45;color:#d5e2e9}.btn.secondary:hover{background:#1d2d33}.btn.ghost{background:transparent;border-color:#34424b;color:#d3dce2}.micro{font:11px ui-monospace,SFMono-Regular,monospace;color:#637480;line-height:1.8;margin-top:23px}.feature{margin-top:78px;border-top:1px solid #26323a;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:27px 0}.feature h3{font-size:12px;letter-spacing:.3px}.feature p{color:#71828e;font-size:12px;line-height:1.65}.game{margin:65px auto 0;max-width:690px}.gamehead{display:flex;justify-content:space-between;align-items:center;color:#8597a3;font:11px ui-monospace,SFMono-Regular,monospace;letter-spacing:1.4px;text-transform:uppercase}.track{display:flex;gap:7px;margin:22px 0 46px}.track span{height:4px;background:#22313a;border-radius:4px;flex:1}.track .done{background:#5abf94}.track .current{background:#b3f6d4}.category{display:inline-block;color:#a6bdc9;border:1px solid #31434c;border-radius:5px;padding:6px 9px;font:10px ui-monospace,SFMono-Regular,monospace;letter-spacing:1.1px;text-transform:uppercase}.question{font-size:clamp(29px,4.7vw,42px);line-height:1.19;letter-spacing:-1.3px;margin:23px 0 22px;font-weight:740}.detail{color:#8296a3;font-size:12px;font-family:ui-monospace,SFMono-Regular,monospace}.entry{display:flex;align-items:center;gap:12px;border:1px solid #355047;background:#101b20;border-radius:11px;padding:13px 19px;margin-top:38px}.entry:focus-within{border-color:#7ce4b7;box-shadow:0 0 0 3px #70e0aa15}.entry input{width:100%;font:500 36px ui-monospace,SFMono-Regular,monospace;color:#eafaf1;border:0;outline:0;background:transparent;min-width:0}.entry input::placeholder{color:#41545e}.entry .unit{color:#7ba48e;font:17px ui-monospace,SFMono-Regular,monospace}.entryhint{font-size:11px;color:#72858e;margin-top:12px}.submit{margin-top:24px;width:100%}.reveal{border:1px solid #2b4d40;background:linear-gradient(135deg,#10241e,#101b21);border-radius:13px;padding:26px;margin-top:28px}.reveal .small{font:10px ui-monospace,SFMono-Regular,monospace;color:#89a69a;letter-spacing:1.4px}.answer{font:650 43px ui-monospace,SFMono-Regular,monospace;color:#8ef0bf;margin:12px 0}.revealgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;border-top:1px solid #284138;padding-top:19px;margin-top:20px}.revealgrid strong{display:block;font-size:18px;margin-top:7px}.points{color:#8ef0bf!important}.chart{margin:21px 0 4px;padding:19px 17px;background:#0d171c;border:1px solid #22343b;border-radius:11px}.charthead{display:flex;justify-content:space-between;color:#8b9da6;font:11px ui-monospace,SFMono-Regular,monospace;margin-bottom:15px}.chart svg{width:100%;height:170px;display:block;overflow:visible}.chart .axis{font:10px ui-monospace,SFMono-Regular,monospace;fill:#70838d}.next{width:100%;margin-top:23px}.scorebig{font:700 clamp(70px,15vw,110px) ui-monospace,SFMono-Regular,monospace;letter-spacing:-8px;color:#8af0bb;margin:20px 0 8px}.scorebig span{font-size:28px;color:#7a9188;letter-spacing:-1px}.scorelist{margin:30px 0;border-top:1px solid #28373e}.scorerow{display:flex;justify-content:space-between;gap:15px;padding:16px 0;border-bottom:1px solid #28373e;font-size:13px}.scorerow .n{color:#6c827e;font:11px ui-monospace,SFMono-Regular,monospace;margin-right:12px}.scorerow strong{font-family:ui-monospace,SFMono-Regular,monospace;color:#a0eec8}.setup{background:#101a20;border:1px solid #30414a;border-radius:12px;padding:24px;margin-top:30px}.setup h3{margin:0 0 9px}.setup p{font-size:12px;color:#8fa2ab;line-height:1.7}.setup select,.setup input[type=file]{width:100%;margin:10px 0 13px;background:#0b1318;color:#e4f3ea;border:1px solid #34454b;border-radius:7px;padding:12px}.setup .btn{padding:10px 14px;font-size:12px}.error{border:1px solid #7d4b44;background:#281b1b;color:#f4b4a9;padding:15px;border-radius:9px;font-size:13px;line-height:1.6;margin-top:18px}.foot{border-top:1px solid #1d2a31;margin-top:95px;padding:25px 0 32px;display:flex;justify-content:space-between;color:#5e737e;font:10px ui-monospace,SFMono-Regular,monospace}.loader{color:#9cd9b9;margin:40px 0}.hidden{display:none!important}@media(max-width:550px){.wrap{padding:0 20px}.main{margin-top:55px}.feature{grid-template-columns:1fr;gap:4px;margin-top:55px}.hero{letter-spacing:-2px}.game{margin-top:38px}.entry input{font-size:28px}.foot{gap:12px;flex-wrap:wrap}}
</style></head><body><div class="wrap"><header class="top"><div class="logo">financia<b>.le</b></div><div class="topright"><span id="date"></span><span class="pill" id="modepill">PRIVATE EDITION</span><button id="homebtn" title="Home">⌂</button></div></header><main id="app"></main><footer class="foot"><span>FINANCIA.LE / PERSONAL FINANCE TRIVIA</span><span>FIVE QUESTIONS. ONE DAILY CHALLENGE.</span></footer></div><script>
const app=document.getElementById('app'),dateEl=document.getElementById('date'),modepill=document.getElementById('modepill');let game=null,mode='demo',idx=0,guesses=[],revealed=false,loading=false;
const dayFmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const fmt=(n,p=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:p,maximumFractionDigits:p});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function score(q,guess){const e=Math.abs(guess-q.answer),tol=q.type==='level'?q.tolerance:q.tolerance;let s=e>=3*tol?0:20*Math.pow(2,-Math.pow(e/tol,2));if(Math.abs(guess-q.display)<Math.pow(10,-q.precision)/2)s=20;return Math.max(0,Math.min(20,s))}
function showHome(err=''){game=null;modepill.textContent='PRIVATE EDITION';app.innerHTML=`<section class="main"><div class="eyebrow">THE DAILY FINANCE GUESSING GAME</div><h1 class="hero">Five numbers.<br>One daily challenge.</h1><p class="muted lead">How well do you really know the markets? Test your intuition across equities, rates, inflation, currencies, and more.</p><div class="actions"><button class="btn" id="real">PLAY TODAY'S GAME ↗</button><button class="btn secondary" id="demo">TRY DEMO →</button></div><p class="micro">01 / ONE DAY AGO &nbsp; 02 / ONE MONTH &nbsp; 03 / SIX MONTHS<br>04 / ONE YEAR &nbsp; 05 / FIVE YEARS</p>${err?`<div class="error">${esc(err)}</div>`:''}<div class="setup"><h3>Private live data</h3><p id="status">Checking data availability…</p><p>International market questions use OECD national share-price indexes for Japan, Germany and Korea via FRED. These are monthly national indexes, <b>not MSCI benchmarks</b> and not USD-denominated MSCI returns.</p><button class="btn secondary" id="refresh">REFRESH FRED DATA ↗</button><p id="refreshmsg"></p><p>Server setup: set <code>FRED_API_KEY</code> in your hosting provider's secret environment variables; never put it in this HTML file.</p></div><div class="feature"><div><h3>01 / NO MULTIPLE CHOICE</h3><p>Make a real estimate. Every answer is a number.</p></div><div><h3>02 / INSTANT REVEAL</h3><p>See the answer, your score, and the underlying chart.</p></div><div><h3>03 / JUST YOU VS. THE MARKET</h3><p>No accounts, streaks, leaderboards, or tracking.</p></div></div></section>`;
document.getElementById('real').onclick=()=>start('real');document.getElementById('demo').onclick=()=>start('demo');document.getElementById('refresh').onclick=async()=>{let el=document.getElementById('refreshmsg');el.textContent='Starting refresh…';try{let r=await fetch('/api/admin/refresh',{method:'POST'}),j=await r.json();el.textContent=j.message||j.error||'Refresh requested';}catch(e){el.textContent=e.message}};fetch('/api/status').then(r=>r.json()).then(s=>{document.getElementById('status').textContent=`${s.seriesCount} real series loaded · ${s.internationalCount}/3 OECD international series loaded · FRED key ${s.fredKey?'configured':'not configured'}.`}).catch(()=>{});}
async function start(m){if(loading)return;loading=true;app.innerHTML='<div class="main loader">PREPARING TODAY\'S CHALLENGE…</div>';try{let r=await fetch('/api/game?mode='+m),j=await r.json();if(!r.ok)throw Error(j.error||'Game unavailable');game=j;mode=m;idx=0;guesses=[];revealed=false;modepill.textContent=m==='demo'?'SIMULATED DEMO':'REAL DATA';dateEl.textContent=dayFmt(j.date);render()}catch(e){showHome(e.message)}finally{loading=false}}
function chart(q){let a=q.chart;if(!a||a.length<2)return '';let vals=a.map(x=>x.value),lo=Math.min(...vals),hi=Math.max(...vals),pad=(hi-lo||1)*.12;lo-=pad;hi+=pad;let W=600,H=170,px=14,py=15;let pt=(v,i)=>[px+i/(a.length-1)*(W-2*px),H-py-(v-lo)/(hi-lo)*(H-2*py)];let points=a.map((x,i)=>pt(x.value,i).map(y=>y.toFixed(2)).join(',')).join(' '),first=pt(a[0].value,0),last=pt(a[a.length-1].value,a.length-1);return `<div class="chart"><div class="charthead"><span>HISTORICAL SERIES</span><span>${esc(q.name)}</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Historical chart for ${esc(q.name)}"><line x1="14" x2="586" y1="85" y2="85" stroke="#263941" stroke-dasharray="3 5"/><polyline points="${points}" fill="none" stroke="#83e9b8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="#8bf0bd" stroke="#0d171c" stroke-width="2"/><text class="axis" x="14" y="164">${esc(dayFmt(a[0].date))}</text><text class="axis" x="586" y="164" text-anchor="end">${esc(dayFmt(a[a.length-1].date))}</text></svg></div>`}
function render(){if(!game)return;if(idx>=5)return results();let q=game.questions[idx],progress=game.questions.map((_,i)=>`<span class="${i<idx?'done':i===idx?'current':''}"></span>`).join('');let a=guesses[idx];app.innerHTML=`<section class="game"><div class="gamehead"><span>${esc(dayFmt(game.date))} / ${mode==='demo'?'SIMULATED DEMO':'DAILY CHALLENGE'}</span><span>QUESTION ${idx+1} / 05</span></div><div class="track">${progress}</div><span class="category">${esc(q.group)} · ${['1 day','1 month','6 months','1 year','5 years'][idx]} ago</span><h2 class="question">${esc(q.question)}</h2><div class="detail">${q.start?'REFERENCE WINDOW: '+dayFmt(q.start)+' → ': 'REFERENCE DATE: '}${dayFmt(q.end)} · ENTER ${esc(q.unit)}</div>${!revealed?`<div class="entry"><input id="guess" inputmode="decimal" type="text" autocomplete="off" spellcheck="false" placeholder="0.00" aria-label="Your numeric answer"><span class="unit">${esc(q.unit)}</span></div><div class="entryhint">Use a minus sign for negative values. Press Enter to submit.</div><button class="btn submit" id="submit" disabled>SUBMIT ANSWER ↗</button>`:`<div class="reveal"><div class="small">THE CORRECT ANSWER</div><div class="answer">${q.answer>0&&q.type!=='level'&&q.type!=='rate_level'?'+':''}${fmt(q.display,q.precision)} <span style="font-size:19px;color:#8fb4a1">${esc(q.unit)}</span></div><div class="revealgrid"><div><div class="small">YOUR GUESS</div><strong>${fmt(a.guess,q.precision)} ${esc(q.unit)}</strong></div><div><div class="small">POINTS EARNED</div><strong class="points">${fmt(a.points,1)} / 20</strong></div></div></div>${chart(q)}<div class="detail">SOURCE: ${esc(q.source)} · REFERENCE: ${dayFmt(q.end)}</div><button class="btn next" id="next">${idx===4?'SEE YOUR RESULTS':'NEXT QUESTION'} →</button>`}</section>`;
if(!revealed){let input=document.getElementById('guess'),btn=document.getElementById('submit');input.focus();input.addEventListener('input',()=>{let v=input.value.trim().replace(/[,$%\s]/g,'');btn.disabled=!v||!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(v)||!Number.isFinite(Number(v))});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)submit()});btn.onclick=submit}else{document.getElementById('next').onclick=()=>{idx++;revealed=false;render()}}}
function submit(){let q=game.questions[idx],raw=document.getElementById('guess').value.trim().replace(/[,$%\s]/g,''),guess=Number(raw);if(!raw||!Number.isFinite(guess))return;guesses[idx]={guess,points:score(q,guess)};revealed=true;render()}
function results(){let total=guesses.reduce((a,x)=>a+x.points,0),rounded=Math.round(total*10)/10;let colors=guesses.map(g=>g.points>=16?'🟩':g.points>=10?'🟨':g.points>=5?'🟧':'⬛').join('');let share=`financia.le ${game.date}${mode==='demo'?' (DEMO)':''}\n${fmt(rounded,1)}/100\n${colors}\nFive numbers. One daily challenge.`;app.innerHTML=`<section class="game"><div class="eyebrow">CHALLENGE COMPLETE · ${esc(dayFmt(game.date))}</div><h1 class="hero" style="margin-bottom:8px">Market intuition,<br>measured.</h1><div class="scorebig">${fmt(rounded,1)}<span>/100</span></div><p class="muted">Five questions. Five estimates. One score.</p><div class="scorelist">${game.questions.map((q,i)=>`<div class="scorerow"><span><span class="n">0${i+1}</span>${esc(q.name)}</span><strong>${fmt(guesses[i].points,1)} / 20</strong></div>`).join('')}</div><div class="actions"><button class="btn" id="share">COPY RESULTS ↗</button><button class="btn secondary" id="back">BACK TO HOME</button></div><p class="micro">${esc(mode==='demo'?'SIMULATED DATA · NOT ACTUAL HISTORICAL MARKET VALUES':'REAL DATA · FROZEN DAILY ANSWERS')}</p></section>`;document.getElementById('share').onclick=async()=>{try{await navigator.clipboard.writeText(share);document.getElementById('share').textContent='COPIED ✓'}catch{let t=document.createElement('textarea');t.value=share;document.body.append(t);t.select();document.execCommand('copy');t.remove();document.getElementById('share').textContent='COPIED ✓'}};document.getElementById('back').onclick=()=>showHome()}
document.getElementById('homebtn').onclick=()=>showHome();showHome();
</script></body></html>
